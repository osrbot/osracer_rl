name = "pace"
description = "Safety-gated PPO fine-tuning for higher whole-lap mean speed"

[algorithm]
name = "ppo"
iterations = 12
steps_per_iteration = 1024
learning_epochs = 4
mini_batches = 8
learning_rate = 0.0001
gamma = 0.99
gae_lambda = 0.95
clip_ratio = 0.2
entropy_coefficient = 0.001
value_coefficient = 0.5
max_gradient_norm = 1.0
checkpoint_interval = 1
imitation_steps = 0
imitation_epochs = 0
refinement_cycles = 0
refinement_epochs = 0
generations = 1
population = 4

[environment]
episode_length_s = 180.0
evaluation_episodes = 6

[task]
name = "racing/bahrain"
opponent_speed_m_s = 2.8
opponent_gap_m = 3.0

[reward]
time_cost = 0.01
pace_weight = 0.25
failure_horizon_scale = 1.0
corner_risk_weight = 0.05

[policy]
pace_guard = true
corner_speed_threshold_m_s = 3.5
corner_steer_threshold = 0.5
corner_slowdown_bins = 1.0

[reproducibility]
seed = 73

[logging]
tensorboard = true
