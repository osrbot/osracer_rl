name = "benchmark"
description = "Track-specific PPO transfer profile for the 24-round season benchmark"

[algorithm]
name = "ppo"
iterations = 1
steps_per_iteration = 256
learning_epochs = 1
mini_batches = 4
learning_rate = 0.0001
gamma = 0.99
gae_lambda = 0.95
clip_ratio = 0.2
entropy_coefficient = 0.001
value_coefficient = 0.5
max_gradient_norm = 1.0
checkpoint_interval = 1
imitation_steps = 14400
imitation_epochs = 16
refinement_cycles = 0
refinement_epochs = 0
generations = 1
population = 4

[environment]
episode_length_s = 180.0
evaluation_episodes = 3

[task]
name = "racing/bahrain"
opponent_speed_m_s = 2.8
opponent_gap_m = 3.0

[reward]
time_cost = 0.01
pace_weight = 0.0
failure_horizon_scale = 0.0

[reproducibility]
seed = 73

[logging]
tensorboard = true
