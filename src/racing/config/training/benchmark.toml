name = "benchmark"
description = "Track-specific PPO transfer profile for the 24-round season benchmark"

[algorithm]
name = "ppo"
iterations = 20
steps_per_iteration = 1024
learning_epochs = 4
mini_batches = 4
learning_rate = 0.0001
gamma = 0.99
gae_lambda = 0.95
clip_ratio = 0.2
entropy_coefficient = 0.001
value_coefficient = 0.5
max_gradient_norm = 1.0
checkpoint_interval = 5
imitation_steps = 14400
imitation_epochs = 10
refinement_cycles = 1
refinement_epochs = 6
generations = 1
population = 4

[environment]
episode_length_s = 180.0
evaluation_episodes = 3

[task]
name = "racing/bahrain"
opponent_speed_m_s = 2.8
opponent_gap_m = 3.0

[reproducibility]
seed = 73

[logging]
tensorboard = true
