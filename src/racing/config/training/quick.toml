name = "quick"
description = "Short smoke training for configuration and environment checks"

[algorithm]
name = "ppo"
iterations = 2
steps_per_iteration = 256
learning_epochs = 2
mini_batches = 2
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
clip_ratio = 0.2
entropy_coefficient = 0.001
value_coefficient = 0.5
max_gradient_norm = 1.0
checkpoint_interval = 1
imitation_steps = 4096
imitation_epochs = 10
refinement_cycles = 0
refinement_epochs = 0
generations = 1
population = 4

[environment]
episode_length_s = 30.0
evaluation_episodes = 1

[task]
name = "racing/bahrain"
opponent_speed_m_s = 2.8
opponent_gap_m = 3.0

[reproducibility]
seed = 73

[logging]
tensorboard = true
