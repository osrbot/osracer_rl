# Stage 0/1 defaults: shadow mode, conservative limits.
osracer_policy_node:
  ros__parameters:
    checkpoint_path: ""  # Required: set to a qualified .pt or .json checkpoint.
    racing_root: ""  # Optional when the racing package is installed.
    shadow_mode: true
    max_speed_mps: 1.0
    max_steering_rad: 0.3
    wheel_radius_m: 0.045
    scan_topic: "/scan"
    odom_topic: "/odometry/filtered"
    ackermann_topic: "/race/raw_ackermann_cmd"
    safety_stop_topic: "/race/safety_stop"
    scan_timeout_s: 0.2
    odom_timeout_s: 0.3
